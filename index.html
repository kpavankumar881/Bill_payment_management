<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Management System - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- LOGIN CONTAINER -->
    <div class="login-container">
        <div class="login-card">
            <h1>💼 BMS</h1>
            <p class="subtitle">Bill Management System</p>
            
            <!-- ERROR MESSAGE -->
            <div id="errorMessage" class="error-message"></div>
            
            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
            </form>
            
            <!-- DEMO INFO -->
            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: center; font-size: 12px; color: var(--text-light);">
                <p><strong>Demo Credentials</strong></p>
                <p>Username: <code>admin</code></p>
                <p>Password: <code>123</code></p>
            </div>
        </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
